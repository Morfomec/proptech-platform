name: Deploy to OCI Production

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to OCI Self-Hosted Runner
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 15

    steps:
      - name: Update Production Repository to Tested Commit
        run: |
          set -euo pipefail
          cd /home/ubuntu/proptech-platform
          git fetch origin "${GITHUB_SHA}"
          git reset --hard "${GITHUB_SHA}"

      - name: Update Backend Dependencies & Run Migrations
        run: |
          set -euo pipefail
          cd /home/ubuntu/proptech-platform/backend
          export PATH="$HOME/.local/bin:$PATH"
          uv pip install --python .venv/bin/python -r requirements-lock.txt
          .venv/bin/python manage.py migrate --noinput

      - name: Collect & Synchronize Static Files
        run: |
          set -euo pipefail
          cd /home/ubuntu/proptech-platform/backend
          .venv/bin/python manage.py collectstatic --noinput
          rsync -av --delete --chmod=D755,F644 staticfiles/ /var/www/proptech-static/

      - name: Build & Deploy Frontend
        run: |
          set -euo pipefail
          cd /home/ubuntu/proptech-platform/frontend
          npm ci --prefer-offline --no-audit --no-fund
          npm run build
          rsync -av --delete --chmod=D755,F644 dist/ /var/www/proptech-frontend/

      - name: Reload Backend & Web Server
        run: |
          set -euo pipefail
          sudo /bin/systemctl restart proptech-gunicorn.service
          sudo /usr/sbin/nginx -t
          sudo /bin/systemctl reload nginx.service

      - name: Verify Services & API Health Check
        run: |
          set -euo pipefail
          sleep 3

          echo "Verifying Gunicorn service status..."
          sudo /bin/systemctl status proptech-gunicorn.service --no-pager > /dev/null

          echo "Verifying Nginx service status..."
          sudo /bin/systemctl status nginx.service --no-pager > /dev/null

          echo "Verifying Gunicorn direct backend response..."
          curl -sSf -H "Host: api.proptech.domioo.in" -H "X-Forwarded-Proto: https" http://127.0.0.1:8000/api/docs/ > /dev/null

          echo "Verifying Nginx frontend delivery (TLS validated)..."
          curl -sSf --resolve proptech.domioo.in:443:127.0.0.1 https://proptech.domioo.in/ > /dev/null

          echo "Verifying Nginx API proxy (TLS validated)..."
          curl -sSf --resolve api.proptech.domioo.in:443:127.0.0.1 https://api.proptech.domioo.in/api/docs/ > /dev/null

          echo "Production deployment successfully completed and verified!"
